<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>System Apocalypse: Idle Defender</title>
	<link rel="icon" type="image/png" sizes="32x32" href="public/icons/favicon-32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="public/icons/favicon-16.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="public/icons/apple-touch-icon.png" />
	<link href="css/apache.css" rel="stylesheet" />
	<script type="module" src="js/main.js"></script>
</head>
<body class="bg-base-100">
<div id="app" class="container mx-auto p-4 font-sans">
	
	<!-- HEADER -->
	<header id="game-header" class="navbar bg-base-300 rounded-box shadow-lg mb-4"></header>
	
	<!-- TABS -->
	<div id="tabs-container" role="tablist" class="tabs tabs-boxed"></div>
	
	<!-- CONTENT AREA -->
	<main id="content-area" class="p-4 bg-base-300 rounded-box mt-4 min-h-[70vh]">
	</main>

</div>

<!-- System Shop Modal with fixed height -->
<dialog id="system-shop-modal" class="modal">
	<div class="modal-box w-11/12 max-w-5xl h-[80vh] flex flex-col p-3">
		<div id="shop-modal-header">
			<!-- Hero name and tokens will be injected here by JS -->
		</div>
		
		<div role="tablist" class="tabs tabs-lifted mt-4 flex-grow min-h-0">
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Items" id="shop-tab-items" data-tab-group="hero" checked />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-items-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Items for sale will be injected here -->
				</div>
			</div>
			
			<!-- NEW: Cards Tab -->
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Cards" id="shop-tab-cards" data-tab-group="hero" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-cards-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Cards for sale will be injected here -->
				</div>
			</div>
			
			<!-- NEW: Martial Skills Tab -->
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Martial Skills" id="shop-tab-martial-skills" data-tab-group="hero" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-martial-skills-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Martial Skills for sale will be injected here -->
				</div>
			</div>
			
			<!-- NEW: Magic Skills Tab -->
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Magic Skills" id="shop-tab-magic-skills" data-tab-group="hero" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-magic-skills-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Magic Skills for sale will be injected here -->
				</div>
			</div>
			
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Inventory" id="shop-tab-inventory" data-tab-group="hero" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-inventory-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Hero inventory will be injected here -->
				</div>
			</div>
			
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Building Upgrades" id="shop-tab-building-upgrades" data-tab-group="building" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="building">
				<div id="shop-modal-building-upgrades-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Building upgrades for sale will be injected here -->
				</div>
			</div>
			
			<input type="radio" name="shop_tabs" role="tab" class="tab" aria-label="Car Upgrades" id="shop-tab-car-upgrades" data-tab-group="hero" />
			<div role="tabpanel" class="tab-content bg-base-100 overflow-y-auto rounded-none" data-tab-group="hero">
				<div id="shop-modal-car-upgrades-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
					<!-- Car upgrades for sale will be injected here -->
				</div>
			</div>
		</div>
		
		<div class="modal-action mt-4">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>


<!-- Text Input Modal -->
<dialog id="text-input-modal" class="modal">
	<div class="modal-box w-11/12 max-w-md">
		<h3 class="font-bold text-lg" data-text-dialog-title></h3>
		<p class="py-4" data-text-dialog-message></p>
		<input class="input input-bordered w-full" data-text-dialog-input />
		<div class="modal-action">
			<button class="btn btn-primary" data-text-dialog-confirm>Confirm</button>
			<button class="btn" data-text-dialog-cancel>Cancel</button>
		</div>
	</div>
</dialog>


<!-- Reset Progress Modal -->
<dialog id="reset-progress-modal" class="modal">
	<div class="modal-box w-11/12 max-w-md">
		<h3 class="font-bold text-lg text-error">Reset Progress?</h3>
		<p class="py-4">This will permanently clear your saved game and start over from the beginning.</p>
		<div class="modal-action">
			<button class="btn btn-error" data-confirm-reset-progress>Reset Progress</button>
			<form method="dialog">
				<button class="btn">Cancel</button>
			</form>
		</div>
	</div>
</dialog>


<!-- Building Upgrade Modal -->
<dialog id="building-upgrade-modal" class="modal">
	<div class="modal-box w-11/12 max-w-3xl">
		<div id="upgrade-modal-header">
			<!-- Building name and party tokens will be injected here by JS -->
		</div>
		<div class="mt-4 max-h-[70vh] overflow-y-auto pr-2">
			<div class="divider my-2">Available Upgrades</div>
			<div id="upgrade-modal-content" class="grid grid-cols-1 md:grid-cols-2 gap-2">
				<!-- Building upgrades will be injected here by JS -->
			</div>
		</div>
		<div class="modal-action">
			<form method="dialog">
				<button class="btn">Close</button>
			</form>
		</div>
	</div>
</dialog>

<!-- Car Purchase Modal -->
<dialog id="car-purchase-modal" class="modal">
	<div class="modal-box w-11/12 max-w-md">
		<div id="car-purchase-modal-header" class="flex justify-between items-center">
			<!-- Car name and price will be injected here -->
		</div>
		<p class="py-4">Select a hero to purchase this vehicle. The cost will be deducted from their personal token balance.</p>
		<div id="car-purchase-heroes-list" class="flex flex-col gap-2">
			<!-- Hero buttons will be injected here by JS -->
		</div>
		<div class="modal-action mt-4">
			<form method="dialog">
				<button class="btn">Cancel</button>
			</form>
		</div>
	</div>
</dialog>


<!-- TEMPLATES -->
<template id="header-template">
	<div class="navbar-start"><div class="font-bold text-xl p-2">System Apocalypse: Idle Defender</div></div>
	<div class="navbar-center hidden lg:flex">
		<div class="stats bg-transparent shadow-none">
			<div class="stat"><div class="stat-title">In-Game Time</div><div class="stat-value text-lg" data-stat="time"></div></div>
			<div class="stat"><div class="stat-title">Game Ticks</div><div class="stat-value text-lg" data-stat="ticks"></div></div>
			<div class="stat"><div class="stat-title">Pop</div><div class="stat-value text-lg text-success" data-stat="population"></div></div>
			<!-- NEW: Added city token and income stats -->
			<div class="stat"><div class="stat-title">City Tokens</div><div class="stat-value text-lg text-warning" data-stat="city-tokens"></div></div>
			<div class="stat"><div class="stat-title">Income/Day</div><div class="stat-value text-lg text-accent" data-stat="city-income"></div></div>
			<!-- END NEW -->
		</div>
	</div>
	<div class="navbar-end flex items-center gap-4">
		<!-- Game speed controls -->
		<div class="btn-group" id="speed-controls">
			<button class="btn btn-sm" data-speed="0.5">1/2x</button>
			<button class="btn btn-sm" data-speed="1">1x</button>
			<button class="btn btn-sm" data-speed="2">2x</button>
			<button class="btn btn-sm" data-speed="4">4x</button>
		</div>
	</div>
</template>

<template id="hero-card-template">
	<div class="card bg-base-200 shadow-xl">
		<div class="card-body p-4">
			<div class="flex justify-between items-start">
				<div>
					<h2 class="card-title text-lg" data-name></h2>
				</div>
				<!-- MODIFICATION: Container for class badge, now fully rendered by JS to prevent refreshing -->
				<div class="flex flex-col items-end gap-1" data-class-container>
					<!-- Badge will be rendered here by JS -->
				</div>
			</div>
			
			<!-- NEW: Separate container for XP bar -->
			<div class="my-1">
				<div class="flex justify-between items-center">
					<span class="label-text text-xs" data-xp-label></span>
					<progress class="progress progress-primary w-[60%]" data-xp-bar></progress>
				</div>
			</div>
			
			<!-- NEW: Separate container for hero status line -->
			<div>
				<p class="text-sm text-gray-400 min-h-5" data-hero-status></p>
			</div>
			
			<!-- Container for multi-slot equipment (now shows images) -->
			<div class="text-xs text-gray-400 mb-2 flex flex-wrap gap-1" data-equipment-container>
				<!-- Equipment will be rendered here by JS -->
			</div>
			
			<!-- NEW: Container for Stats -->
			<div class="grid grid-cols-2 gap-1 text-xs mt-2 mb-2" data-stats-container>
				<!-- Stats will be rendered here by JS -->
			</div>
			
			<!-- Stat bars -->
			<div class="flex justify-between items-center my-1">
				<span class="label-text text-xs" data-hp-label></span>
				<progress class="progress progress-success w-[40%]" data-hp-bar></progress>
			</div>
			<!-- NEW: Added stamina bar -->
			<div class="flex justify-between items-center my-1" data-stamina-container>
				<span class="label-text text-xs" data-stamina-label></span>
				<progress class="progress progress-warning w-[40%]" data-stamina-bar></progress>
			</div>
			<div class="flex justify-between items-center my-1" data-mp-container>
				<span class="label-text text-xs" data-mp-label></span>
				<progress class="progress progress-info w-[40%]" data-mp-bar></progress>
			</div>
			<div class="flex justify-between items-center my-1" data-rage-container style="display: none;">
				<span class="label-text text-xs" data-rage-label></span>
				<progress class="progress progress-error w-[40%]" data-rage-bar></progress>
			</div>
			
			<!-- NEW: Container for skill cards -->
			<div class="mt-4 flex flex-wrap gap-2 justify-center" data-skills-container>
				<!-- Skill cards will be rendered here by JS -->
			</div>
		</div>
	</div>
</template>
</body>
</html>
